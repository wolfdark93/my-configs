music_directory "/mnt/Datos/Música"
playlist_directory "~/Music/playlists"
db_file "~/.config/mpd/database"
log_file "~/.config/mpd/log"
pid_file "~/.config/mpd/pid"
state_file "~/.config/mpd/state"
sticker_file "~/.config/mpd/sticker.sql"

bind_to_address "127.0.0.1"
port "6600"
auto_update "yes"
restore_paused "yes"

audio_output {
    type     "pipewire"
    name     "PipeWire Sound Server"
}

# --- MODO 1: Para FLAC/MP3 (Mantiene los kHz originales) ---
audio_output {
    type            "alsa"
    name            "Shanling M0s (FLAC Bit-Perfect)"
    device          "hw:5,0"
    format          "*:32:*"
    mixer_type      "none"
}

# --- MODO 2: Exclusivo para archivos DSD pesados ---
audio_output {
    type            "alsa"
    name            "Shanling M0s (DSD Alta Resolución)"
    device          "hw:5,0"
    format          "192000:32:2"
    mixer_type      "none"
}

audio_output {
    type    "fifo"
    name    "my_fifo"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
